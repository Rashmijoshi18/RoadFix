<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - RoadFix</title>
    <meta
      name="description"
      content="Create a RoadFix account to report road issues and track updates."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="container nav-container">
        <a href="login.html" class="logo"
          ><i class="fas fa-road"></i> RoadFix</a
        >
        <div class="nav-right">
          <button
            class="theme-toggle"
            onclick="toggleTheme()"
            aria-label="Toggle Theme"
          >
            <i class="fas fa-moon" id="theme-icon"></i>
          </button>
        </div>
      </div>
    </nav>

    <main class="login-page register-page">
      <div class="register-wrapper">
        <div class="login-card">
          <div class="login-header">
            <div class="login-icon-circle">
              <i class="fas fa-user-plus"></i>
            </div>
            <h1>Create Account</h1>
            <p>Register as a citizen and start reporting issues</p>
          </div>

          <form id="registerForm" autocomplete="off">
            <div class="form-group">
              <label for="registerName"
                ><i class="fas fa-user"></i> Full Name</label
              >
              <input
                type="text"
                id="registerName"
                name="name"
                required
                placeholder="Enter your full name"
                autocomplete="name"
              />
            </div>

            <div class="form-group">
              <label for="registerEmail"
                ><i class="fas fa-envelope"></i> Email Address</label
              >
              <input
                type="email"
                id="registerEmail"
                name="email"
                required
                placeholder="you@example.com"
                autocomplete="email"
              />
            </div>

            <div class="form-group">
              <label for="registerPassword"
                ><i class="fas fa-lock"></i> Password</label
              >
              <div class="password-wrapper">
                <input
                  type="password"
                  id="registerPassword"
                  name="password"
                  required
                  minlength="6"
                  placeholder="Minimum 6 characters"
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="password-toggle-btn"
                  id="registerPasswordToggleBtn"
                  aria-label="Toggle password visibility"
                >
                  <i class="fas fa-eye" id="registerPasswordToggleIcon"></i>
                </button>
              </div>
            </div>

            <div id="registerError" class="login-error hidden"></div>

            <button
              type="submit"
              class="btn btn-primary"
              id="registerSubmitBtn"
            >
              <i class="fas fa-user-check"></i> Create Account
            </button>

            <p class="register-redirect-text">
              Already have an account?
              <a href="login.html">Sign in</a>
            </p>
          </form>
        </div>
      </div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script>
      const registerPasswordToggleBtn = document.getElementById(
        "registerPasswordToggleBtn",
      );
      const registerPasswordInput = document.getElementById("registerPassword");
      const registerPasswordToggleIcon = document.getElementById(
        "registerPasswordToggleIcon",
      );

      registerPasswordToggleBtn.addEventListener("click", () => {
        const isPassword = registerPasswordInput.type === "password";
        registerPasswordInput.type = isPassword ? "text" : "password";
        registerPasswordToggleIcon.classList.toggle("fa-eye", !isPassword);
        registerPasswordToggleIcon.classList.toggle("fa-eye-slash", isPassword);
      });

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const name = document.getElementById("registerName").value.trim();
          const email = document
            .getElementById("registerEmail")
            .value.trim()
            .toLowerCase();
          const password = document.getElementById("registerPassword").value;

          const errorBox = document.getElementById("registerError");
          const submitBtn = document.getElementById("registerSubmitBtn");

          errorBox.classList.add("hidden");
          errorBox.textContent = "";

          if (!name || !email || !password) {
            errorBox.textContent = "All fields are required.";
            errorBox.classList.remove("hidden");
            return;
          }

          if (password.length < 6) {
            errorBox.textContent = "Password must be at least 6 characters.";
            errorBox.classList.remove("hidden");
            return;
          }

          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Creating account...';

          try {
            const response = await fetch("/api/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, email, password }),
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
              throw new Error(result.error || "Failed to create account.");
            }

            const user = result.data;
            localStorage.setItem("userRole", user.role);
            localStorage.setItem("userName", user.name);
            localStorage.setItem("userId", user.id);

            if (window.showToast)
              window.showToast("Account created successfully!", "success");
            window.location.href = "index.html";
          } catch (err) {
            errorBox.textContent = err.message || "Registration failed.";
            errorBox.classList.remove("hidden");
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML =
              '<i class="fas fa-user-check"></i> Create Account';
          }
        });

      if (localStorage.getItem("userRole")) {
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
