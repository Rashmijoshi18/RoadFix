<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — RoadFix</title>
    <meta name="description" content="Get in touch with the RoadFix team. We're here to help with questions, feedback, and support.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<nav class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo"><i class="fas fa-road"></i> RoadFix</a>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="report.html">Report Issue</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <div class="nav-user-info" id="navUserInfo"></div>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
        </div>
    </div>
</nav>
<script>
(function(){
    const role=localStorage.getItem('userRole'),name=localStorage.getItem('userName');
    if(!role){window.location.href='login.html';return;}
    const info=document.getElementById('navUserInfo');
    if(info){info.innerHTML=`<span class="role-badge role-${role}">${role.charAt(0).toUpperCase()+role.slice(1)}</span><button class="btn-logout" onclick="handleLogout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>`;}
    window.handleLogout=async function(){try{await fetch('/api/auth/logout',{method:'POST',headers:{'x-user-role':role,'x-user-name':name||''}});}catch(e){}localStorage.clear();window.location.href='login.html';};
})();
</script>

<div class="hero">
    <div class="container">
        <h1>Get in <span>Touch</span></h1>
        <p>Have a question or feedback? We'd love to hear from you.</p>
    </div>
</div>

<main class="container" style="max-width:640px;padding-bottom:5rem;">
    <section class="form-container">

        <div id="contactSuccess" class="success-banner hidden" style="margin-bottom:1.5rem;">
            <div class="success-banner-icon"><i class="fas fa-check-circle"></i></div>
            <div class="success-banner-body">
                <h3>Message Sent!</h3>
                <p>We'll get back to you as soon as possible.</p>
            </div>
        </div>

        <form id="contactForm">
            <div class="form-group">
                <label for="contactName"><i class="fas fa-user"></i> Your Name <span class="required">*</span></label>
                <input type="text" id="contactName" name="name" required placeholder="e.g. Priya Sharma" maxlength="100">
            </div>
            <div class="form-group">
                <label for="contactEmail"><i class="fas fa-envelope"></i> Email Address <span class="required">*</span></label>
                <input type="email" id="contactEmail" name="email" required placeholder="you@example.com" maxlength="150">
            </div>
            <div class="form-group">
                <label for="contactSubject"><i class="fas fa-pen"></i> Subject <span class="required">*</span></label>
                <input type="text" id="contactSubject" name="subject" required placeholder="How can we help?" maxlength="150">
            </div>
            <div class="form-group">
                <label for="contactMessage"><i class="fas fa-comment-dots"></i> Message <span class="required">*</span></label>
                <textarea id="contactMessage" name="message" rows="5" required placeholder="Write your message here..." maxlength="1500"></textarea>
            </div>
            <div id="contactError" class="message error hidden"></div>
            <button type="submit" class="btn btn-primary" id="contactSubmit" style="width:100%;">
                <i class="fas fa-paper-plane"></i> Send Message
            </button>
        </form>
    </section>
</main>

<div id="toast-container" class="toast-container"></div>
<script src="js/toast.js"></script>
<script>
document.getElementById('contactForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('contactSubmit');
    const errEl = document.getElementById('contactError');
    errEl.classList.add('hidden');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

    const payload = {
        name:    document.getElementById('contactName').value.trim(),
        email:   document.getElementById('contactEmail').value.trim(),
        subject: document.getElementById('contactSubject').value.trim(),
        message: document.getElementById('contactMessage').value.trim()
    };

    try {
        const res = await fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Failed to send message.');
        document.getElementById('contactSuccess').classList.remove('hidden');
        this.reset();
        if (window.showToast) showToast('Message sent successfully!', 'success');
    } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
    }
});
</script>
</body>
</html>
