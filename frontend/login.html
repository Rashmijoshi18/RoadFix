<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - RoadFix</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="js/theme.js" defer></script>
    <style>
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 5rem);
            padding: 2rem;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 3rem;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            letter-spacing: -1px;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .tabs {
            display: flex;
            background: var(--input-bg);
            border-radius: var(--radius-full);
            padding: 0.4rem;
            margin-bottom: 2.5rem;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 0.85rem;
            border: none;
            background: none;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: var(--radius-full);
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--bg-solid);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .social-login {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .social-login p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .social-btns {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--bg-solid);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .social-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px);
            background: var(--info-bg);
        }

        .floating-label-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .floating-label-group i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: var(--transition);
            pointer-events: none;
        }

        .floating-label-group input {
            padding-left: 3.25rem;
        }

        .floating-label-group input:focus + i {
            color: var(--primary);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><i class="fas fa-road"></i> RoadFix</a>
            <div class="nav-right">
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 id="auth-title">Welcome Back</h1>
                <p id="auth-subtitle">Sign in to continue to RoadFix</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div id="login-form-container" class="form-content active">
                <form id="loginForm">
                    <div class="floating-label-group">
                        <i class="fas fa-envelope"></i>
                        <input type="text" id="loginEmail" placeholder="Email Address" required>
                    </div>
                    <div class="floating-label-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Password" style="width: 100%; padding: 1rem 1.25rem 1rem 3.25rem; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-family: inherit; font-size: 1rem; background-color: var(--input-bg); color: var(--text-primary); transition: var(--transition);" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        Sign In <i class="fas fa-sign-in-alt"></i>
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form-container" class="form-content">
                <form id="registerForm">
                    <div class="floating-label-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="regName" placeholder="Full Name" required>
                    </div>
                    <div class="floating-label-group">
                        <i class="fas fa-envelope"></i>
                        <input type="text" id="regEmail" placeholder="Email Address" required>
                    </div>
                    <div class="floating-label-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="Create Password" style="width: 100%; padding: 1rem 1.25rem 1rem 3.25rem; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-family: inherit; font-size: 1rem; background-color: var(--input-bg); color: var(--text-primary); transition: var(--transition);" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        Create Account <i class="fas fa-user-plus"></i>
                    </button>
                </form>
            </div>

            <div id="authMessage" class="message hidden"></div>

            <div class="social-login">
                <p>Or continue with</p>
                <div class="social-btns">
                    <button class="social-btn"><i class="fab fa-google"></i></button>
                    <button class="social-btn"><i class="fab fa-apple"></i></button>
                    <button class="social-btn"><i class="fab fa-github"></i></button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        function switchTab(type) {
            const loginForm = document.getElementById('login-form-container');
            const registerForm = document.getElementById('register-form-container');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const buttons = document.querySelectorAll('.tab-btn');

            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (type === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                title.innerText = 'Welcome Back';
                subtitle.innerText = 'Sign in to continue to RoadFix';
                buttons[0].classList.add('active');
            } else {
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
                title.innerText = 'Join RoadFix';
                subtitle.innerText = 'Start making your community better';
                buttons[1].classList.add('active');
            }
            
            // Clear message when switching
            const msg = document.getElementById('authMessage');
            msg.classList.add('hidden');
        }
    </script>
</body>
</html>
